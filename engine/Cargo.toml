[package]
name = "az-agent-engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1.89"
futures-util = "0.3"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1.47.1", features = ["sync"] }

[dev-dependencies]
axum = "0.8.6"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread"] }
