[package]
name = "az-agent-frontend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
az-agent-model = { path = "../shared/rust" }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "d1c82adf2582a2e7e85e44ebf7e5eb0b1f01b804" }
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "web", "launch"] }
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }
console_error_panic_hook = "0.1.7"

base64 = "0.22"
js-sys = "0.3"
wasm-bindgen = "0.2"
dioxus-icons = { version = "0.1.0", default-features = false }
