name: Verify Agent
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aio-plugin-agent
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: development-only
          POSTGRES_DB: agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developer -d agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIO_TEST_DATABASE_URL: postgres://developer:development-only@127.0.0.1:5432/agent_test
      AIO_MEMORY_TEST_DIRECTORY: build/ci-memory
    steps:
      - uses: actions/checkout@v4
        with:
          path: aio-plugin-agent
      - uses: actions/checkout@v4
        with:
          repository: org-aio/aio-plugin-agent-memory
          ref: 9bf34a79bd14616b70bc11a22848957a32cd6aba
          path: aio-plugin-agent-memory
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aio-plugin-agent/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-25
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            aio-plugin-agent
            aio-plugin-agent-memory
      - run: npm ci --ignore-scripts
      - run: node scripts/check-family.mjs ../aio-plugin-agent-memory
      - run: node scripts/check-sdk.mjs
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - name: Verify durable device requests and compound instructions
        env:
          AIO_AGENT_DEV_DIRECTORY: build/ci-device
          AIO_INPUT_TEST_CONFIG: ${{ github.workspace }}/aio-plugin-agent/build/ci-device/runtime.json
        run: |
          node scripts/setup-dev.mjs
          cargo test --locked -p az-agent-server -- --ignored --test-threads=1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked -p az-agent-server
      - run: cargo run --locked -p az-agent-frontend -- dist/frontend
      - run: node scripts/package-frontend.mjs
      - run: sh scripts/build-memory-fixture.sh
      - run: psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'REVOKE ALL ON SCHEMA public FROM PUBLIC'
      - run: npx playwright install --with-deps chrome
      - run: npm run test:cloud
      - run: npm run test:ui
        env:
          AIO_UI_BROWSER_CHANNEL: chrome
      - run: npm run test:mobile
        env:
          AIO_UI_BROWSER_CHANNEL: chrome
      - run: npm run test:processing
        env:
          AIO_UI_BROWSER_CHANNEL: chrome
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-verification
          path: aio-plugin-agent/test-results/
