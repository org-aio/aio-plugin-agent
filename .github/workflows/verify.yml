name: Verify Agent
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aio-plugin-agent
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: development-only
          POSTGRES_DB: agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developer -d agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIO_TEST_DATABASE_URL: postgres://developer:development-only@127.0.0.1:5432/agent_test
      AIO_MEMORY_TEST_DIRECTORY: build/ci-memory
    steps:
      - uses: actions/checkout@v4
        with:
          path: aio-plugin-agent
      - uses: actions/checkout@v4
        with:
          repository: zjarlin/aio-plugin-agent-memory
          ref: 364f58b8af05efb4166edd199541ac78c0c6c7d5
          path: aio-plugin-agent-memory
      - uses: actions/checkout@v4
        with:
          repository: zjarlin/aio-platform
          ref: 3bfac7ee4fb8355813df0e48ecc33cf6ea56a231
          path: aio-platform
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aio-plugin-agent/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-25
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            aio-plugin-agent
            aio-plugin-agent-memory/dev
      - name: Install pinned frontend and component tools
        run: |
          curl -fL --retry 3 https://github.com/DioxusLabs/dioxus/releases/download/v0.7.9/dx-x86_64-unknown-linux-gnu.tar.gz -o /tmp/dx.tar.gz
          echo '3b132551b480bc96f938f9f0d37936ee1190f994977539dcc347eaf38540d005  /tmp/dx.tar.gz' | sha256sum -c -
          tar -xzf /tmp/dx.tar.gz -C "$HOME/.cargo/bin"
          cargo install wasm-tools --version 1.240.0 --locked
      - run: npm ci --ignore-scripts
      - run: node scripts/check-family.mjs ../aio-plugin-agent-memory
      - run: node scripts/check-sdk.mjs
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked -p az-agent-server
      - run: dx build --package az-agent-frontend --platform web --release
      - run: node scripts/package-frontend.mjs
      - run: sh scripts/build-memory-fixture.sh
      - run: psql "$AIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'REVOKE ALL ON SCHEMA public FROM PUBLIC'
      - run: npx playwright install --with-deps chrome
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-verification
          path: aio-plugin-agent/test-results/
