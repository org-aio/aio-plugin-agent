name: Verify Agent
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: development-only
          POSTGRES_DB: agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developer -d agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIO_TEST_DATABASE_URL: postgres://developer:development-only@127.0.0.1:5432/agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-25
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --ignore-scripts
      - run: node scripts/check-family.mjs
      - run: node scripts/check-sdk.mjs
      - run: node scripts/generate-contract.mjs --check
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked -p az-agent-server
      - run: node scripts/test-service.mjs
      - run: ./kotlin build -m frontend -p wasmJs -v release
      - run: mkdir -p dist/frontend && cp -R build/tasks/_frontend_buildWasmJsAppWasmJsRelease/. dist/frontend/
      - run: npx playwright install --with-deps chrome
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-verification
          path: test-results/
